[package]
name = "moduled"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A portable local daemon for scheduling scripts"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
croner = "3"
ctrlc = { version = "3.5", features = ["termination"] }
notify = "8"
rhai = { version = "1.27", features = ["no_module"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
